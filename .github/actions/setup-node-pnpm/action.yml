name: "Setup Node.js and pnpm"
description: "Sets up Node.js, pnpm, and installs dependencies with caching"
inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "24"
  registry-url:
    description: "npm registry URL to configure in .npmrc for auth (e.g. https://registry.npmjs.org)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    # No `version`: pnpm/action-setup reads the `packageManager` field in
    # package.json, so CI runs the pnpm the lockfile was written with.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
