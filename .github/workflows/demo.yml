name: Demo

# Re-renders the README GIFs and the site video from demo/*.tape and opens a PR with the result.
# Local equivalent: `pnpm build && demo/render.sh` (see demo/render.sh for the tools it needs).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "src/components/**"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the regenerated-assets branch
      pull-requests: write # open or update its PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24

      - name: Build
        run: pnpm build

      - name: Install tree, gifsicle and an emoji font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tree gifsicle fonts-noto-color-emoji

      - name: Install VHS
        uses: charmbracelet/vhs-action@v2
        with:
          version: v0.12.1

      - name: Render
        run: demo/render.sh

      - name: Open a pull request with the new assets
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/demo-assets
          delete-branch: true
          add-paths: |
            assets/demo-dark.gif
            assets/demo-light.gif
            assets/demo.mp4
            assets/demo-poster.webp
          commit-message: "docs(demo): re-render the demo"
          title: "docs(demo): re-render the demo"
          body: |
            Regenerated by `.github/workflows/demo.yml` from `demo/*.tape` at ${{ github.sha }}.

            Check the GIFs (dark and light) and `assets/demo.mp4` before merging.
