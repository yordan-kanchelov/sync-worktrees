name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Skip only documentation-only changes. Everything else (sources, tests, configs,
    # lockfile, workflows, composite actions, changesets) runs the checks, so a required
    # check is never left 'skipped' for a PR that touches code. site/ has its own workflow.
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "assets/**"
      - "site/**"

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress; there is nothing to learn from finishing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-changeset:
    name: Verify Changeset
    runs-on: ubuntu-latest
    if: github.head_ref != 'changeset-release/main'
    outputs:
      has-changeset: ${{ steps.check.outputs.has-changeset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 24

      - name: Check for changeset
        id: check
        run: |
          # Check if this PR touches any code files. site/ is excluded: it is not part of the
          # package, and its own package.json/lockfile would otherwise demand a changeset.
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- . ':(exclude)site/' | grep -E '\.(ts|tsx|js|cjs|mjs|json)$' > /dev/null || {
            echo "No code changes detected, skipping changeset check"
            echo "has-changeset=skip" >> $GITHUB_OUTPUT
            exit 0
          }

          # Check if there's a changeset
          if pnpm changeset status --since=origin/${{ github.base_ref }}; then
            echo "has-changeset=true" >> $GITHUB_OUTPUT
          else
            echo "::error::This PR contains code changes but is missing a changeset. Please run 'pnpm changeset' and commit the generated file."
            echo "::error::If this change doesn't need a version bump (e.g., internal refactoring, tests, docs), you can create an empty changeset."
            echo "has-changeset=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  lint-and-test:
    # The Ubuntu leg keeps its original name, so an existing required status check still matches it.
    name: Lint, Type Check & Test (Node ${{ matrix.node-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    needs: check-changeset
    if: ${{ !cancelled() && needs.check-changeset.result != 'failure' && needs.check-changeset.outputs.has-changeset != 'false' }}
    strategy:
      # A failure on one OS must not hide the result on the other.
      fail-fast: false
      matrix:
        # The package declares `os: ["darwin", "linux"]`, so both are tested.
        os: [ubuntu-latest, macos-latest]
        # 24 is the `engines.node` minimum and the version the release job publishes with.
        # 22 was dropped when the floor was raised: testing a runtime the package refuses to
        # install on is noise, and a `.ts` config relies on type stripping being on by default.
        # (The esbuild target stays `node22` — a lower downlevel target runs fine on 24 and
        # says nothing about what the package supports.)
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Linter
        run: pnpm lint

      - name: Check Formatting
        run: pnpm format:check

      - name: Run Type Check
        run: pnpm typecheck

      - name: Build Project
        run: pnpm build

      # Tests import the TypeScript sources, so this is the only check that runs the built
      # bin shim, the esbuild bundles and the npm tarball contents before publish.
      - name: Smoke Test Build
        run: pnpm smoke

      - name: Run Tests with Coverage
        id: tests
        run: pnpm test:coverage
        # Non-blocking on macOS until the known darwin failures are fixed (tmpdir under the
        # /var -> /private/var symlink breaks worktree-path comparisons). Lint, type check,
        # build and smoke still gate this leg. Tracked in docs/internal/FOLLOW-UPS.md (FU-CI-1).
        continue-on-error: ${{ matrix.os == 'macos-latest' }}

      # Coverage totals on the run page, from coverage/coverage-summary.json (no upload service).
      # Ubuntu only, so the summary holds one table; it also runs when a threshold fails the step.
      - name: Coverage Summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && steps.tests.outcome != 'skipped' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Reports
        if: success()
        uses: actions/upload-artifact@v7
        with:
          # upload-artifact rejects a second upload to the same name within a run, so each matrix leg gets its own.
          name: coverage-report-${{ matrix.os }}-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
