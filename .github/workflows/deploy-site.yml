name: Site CI

on:
  pull_request:
    paths:
      - "site/**"
      - "assets/demo.mp4"
      - "assets/demo-poster.webp"
      - "README.md"
      - ".github/workflows/deploy-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/demo.mp4"
      - "assets/demo-poster.webp"
      - "README.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  # release.yml calls this after publishing, so the site build and deploy steps exist only here.
  workflow_call:

permissions:
  contents: read

# PR builds are superseded by the next push; runs on main (including the call from release.yml,
# which shares this group) queue instead, so neither cancels the other's deployment.
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          SITE_URL: https://sync-worktrees.com
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One Pages deployment at a time, whichever workflow or ref started it.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
