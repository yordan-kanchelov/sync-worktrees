- id: list_worktrees
  name: list_worktrees
  desc: "Status-labelled list (clean / dirty / stale / current), divergence, safeToRemove, last sync."
  order: 1
- id: get_worktree_status
  name: get_worktree_status
  desc: "Per-worktree detail: dirty files, unpushed commits, stashes, operation in progress."
  order: 2
- id: create_worktree
  name: create_worktree
  desc: "Create a worktree for a branch. Optionally branch from baseBranch and publish with --no-track + push -u."
  order: 3
- id: sync
  name: sync
  desc: "Full sync cycle: fetch, create, prune, update."
  order: 4
- id: update_worktree
  name: update_worktree
  desc: "Fast-forward one worktree to match upstream."
  order: 5
- id: detect_context
  name: detect_context
  desc: "Resolve which config and repo a path belongs to, and which operations are available there."
  order: 6
