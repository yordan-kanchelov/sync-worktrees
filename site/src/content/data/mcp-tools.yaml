# The nine tools sync-worktrees-mcp registers (src/mcp/server.ts), in the order an agent meets them.
# Full table, launch situations, error codes and safety: docs/mcp.md.
- id: detect_context
  name: detect_context
  desc: "Call first. Works out which config and repo a path belongs to, lists the worktrees around it, and reports which tools work from there."
  order: 1
- id: list_worktrees
  name: list_worktrees
  desc: "Every worktree with a status label (clean, dirty, stale), whether it is safe to remove, and when it last synced — across all repos, or one."
  order: 2
- id: get_worktree_status
  name: get_worktree_status
  desc: "Per-worktree detail: dirty files, unpushed commits, stashes, operation in progress."
  order: 3
- id: create_worktree
  name: create_worktree
  desc: "Worktree mode only. Check out a branch in its own directory; a new branch is pushed create-only, so an existing remote branch is never moved."
  order: 4
- id: update_worktree
  name: update_worktree
  desc: "Fast-forward one worktree to match upstream. Worktree mode only."
  order: 5
- id: sync
  name: sync
  desc: "Full sync cycle: fetch, create, prune, update. Needs a loaded config; flagged destructive so clients can prompt."
  order: 6
- id: initialize
  name: initialize
  desc: "Clone the bare repo and create the default-branch worktree. Needs a loaded config."
  order: 7
- id: load_config
  name: load_config
  desc: "Load or switch the config at runtime, when the server cannot find one from where it started."
  order: 8
- id: set_current_repository
  name: set_current_repository
  desc: "Pick the active repo when several are configured."
  order: 9
