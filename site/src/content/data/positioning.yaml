main:
  heroHeadlineLine1: "Keep every branch checked out."
  heroHeadlineLine2: "Switching is just cd."
  heroSubhead: "turns each Git branch, in every repo you declare, into a folder on disk — kept in sync with the remote. A new machine is one config file."
  heroDiskNote: "Git history is stored once. Dirty trees and unpushed commits are left alone."
  metaTitle: "sync-worktrees — keep every branch checked out"
  metaDescription: "Keep every Git branch across every repo checked out as a folder you can cd into. Auto-synced with the remote. One config file rebuilds the whole workspace on a new machine."
  ogImageAlt: "sync-worktrees — keep every branch checked out"
  ctaHeadline: "Every branch, checked out and current."
  ctaSubhead: "Point it at your repos. Stop stashing to look at another branch."
  llmsSummary: "A Git workspace tool. Keeps every selected branch across every repo checked out as a stable directory, automatically synced with the remote. One config file rebuilds the layout on a new machine. Optional MCP server (sync-worktrees-mcp) for clients that speak it. A per-repo clone mode keeps a single branch checked out at a fixed path instead — for dependency siblings that expect fixed relative paths."
  llmsFullIntro: "This file is the plain-text companion to https://sync-worktrees.com — designed for LLM crawlers and training pipelines. It contains the landing-page hero copy, problem statement, feature descriptions, MCP configuration snippets for every supported AI tool, the full FAQ, and the canonical README in that order."
