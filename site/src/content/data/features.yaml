- id: worktree-mode
  icon: git-branch
  title: Worktree mode
  body: "Every remote branch that passes your filters gets its own directory, all sharing one Git database. History is stored once, but each branch still costs a full checkout — that is what the filters are for."
  order: 1
- id: clone-mode
  icon: clone
  title: Clone mode
  body: "When one checkout is enough, get a single branch checked out at a fixed path — no `.bare/`, no per-branch subfolders. First-class alternative for dependency siblings."
  order: 2
- id: tui
  icon: monitor
  title: Interactive TUI
  body: "Ink-based terminal UI with wizards for opening worktrees in editor or terminal, creating branches, and inspecting multi-repo status."
  order: 3
- id: filtering
  icon: filter
  title: Filtering
  body: "Glob include/exclude, age-based pruning, sparse checkout for monorepos, per-repo overrides."
  order: 4
- id: safety
  icon: shield
  title: Safety by default
  body: "It won't touch your work: a dirty worktree is never fast-forwarded, pruned or replaced, and anything it does remove moves to `.trash/`, restorable for 30 days unless you turn trash off. A diverged branch is never merged or overwritten — your commits are pinned in `.trash/` and a fresh checkout replaces the folder, or it is reset in place if you have committed nothing since the last sync."
  order: 5
- id: mcp-server
  icon: command
  title: Optional MCP server
  body: "A second binary, sync-worktrees-mcp, speaks MCP over stdio if a client wants it. The folders are ordinary directories either way."
  order: 6
