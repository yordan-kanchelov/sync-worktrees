- id: worktree-mode
  icon: git-branch
  title: Worktree mode
  body: "Every remote branch that passes your filters gets its own directory, all sharing one Git database. History is stored once; each branch still costs a full checkout, so bound the set with `branchMaxAge`, include/exclude globs and sparse checkout."
  order: 1
- id: clone-mode
  icon: clone
  title: Clone mode
  body: "When one checkout is enough, get a single branch checked out at a fixed path — no .bare/, no per-branch subfolders. First-class alternative for dependency siblings."
  order: 2
- id: tui
  icon: monitor
  title: Interactive TUI
  body: "Ink-based terminal UI with wizards for opening worktrees in editor or terminal, creating branches, and inspecting multi-repo status."
  order: 3
- id: filtering
  icon: filter
  title: Filtering
  body: "Glob include/exclude, age-based pruning, sparse checkout for monorepos, per-repo overrides."
  order: 4
- id: safety
  icon: shield
  title: Safety by default
  body: "It won't touch your work: fast-forward skips any worktree with uncommitted changes or unpushed commits (unless upstream moved too — the diverged case); removal also refuses stashes, in-progress operations, modified submodules and a detached HEAD, and means a move to `.trash/` (restorable for 30 days). A branch that diverged — a force-push, or a teammate's push while you had local commits — is moved to `.trash/` with its commits pinned and a fresh checkout takes its place (or, when you made no commits since the last sync or your tree already matches upstream, simply reset in place), never merged or overwritten."
  order: 5
- id: mcp-server
  icon: command
  title: Optional MCP server
  body: "A second binary, sync-worktrees-mcp, speaks MCP over stdio if a client wants it. The folders are ordinary directories either way."
  order: 6
